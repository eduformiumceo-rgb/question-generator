<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/questions-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/questions-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      /* Apply the saved theme before first paint so there is no flash. Default is light. */
      try { var m = localStorage.getItem("glpg_theme"); var d = m === "dark" || ((m === "auto" || m === "system") && matchMedia("(prefers-color-scheme: dark)").matches); document.documentElement.setAttribute("data-theme", d ? "dark" : "light"); document.documentElement.style.colorScheme = d ? "dark" : "light"; } catch (e) {}
    </script>
    <title>Eduformium: Questions Generator</title>
    <meta name="description" content="Build print-ready class tests, quizzes and exams from the Ghana NaCCA curriculum in minutes." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0D9488" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Questions" />
    <link rel="apple-touch-icon" href="/questions-apple-touch-icon.png" />

    <!-- Logo font only (Playfair Display 800). Loaded WITHOUT blocking the first paint: preload + swap in on load; text shows at once in a serif fallback. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&display=swap" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
